<!DOCTYPE html>
<html>
<head>
    <title>Edit Application</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <h2>Edit Application</h2>

    <div class="card p-4 shadow">

        <form method="POST">

            <input name="company" value="{{ app.company }}" class="form-control mb-3">

            <input name="role" value="{{ app.role }}" class="form-control mb-3">

            <select name="status" class="form-select mb-3">
                <option {% if app.status == "Applied" %}selected{% endif %}>Applied</option>
                <option {% if app.status == "Interview" %}selected{% endif %}>Interview</option>
                <option {% if app.status == "Rejected" %}selected{% endif %}>Rejected</option>
                <option {% if app.status == "Selected" %}selected{% endif %}>Selected</option>
            </select>

            <button class="btn btn-success">Update</button>

        </form>

    </div>

</div>

</body>
</html>
